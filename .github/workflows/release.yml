# Builds the single-file valheimdisplay executable for each platform.
# Every push to main builds them (download from the run's artifacts); a v* tag also publishes a release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: windows-latest, name: windows-x64, ext: .exe }
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-13, name: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - run: uv run pyinstaller --noconfirm valheimdisplay.spec
      - name: smoke test
        shell: bash
        run: |
          dist/valheimdisplay${{ matrix.ext }} --version
          dist/valheimdisplay${{ matrix.ext }} selftest
          mkdir -p smoke && dist/valheimdisplay${{ matrix.ext }} --home smoke detect
      - name: name the file
        shell: bash
        run: mv dist/valheimdisplay${{ matrix.ext }} dist/valheimdisplay-${{ matrix.name }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: valheimdisplay-${{ matrix.name }}
          path: dist/valheimdisplay-${{ matrix.name }}${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

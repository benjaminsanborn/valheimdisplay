[project]
name = "valheimdisplay"
version = "0.2.0"
description = "A 3D website of your Valheim server's world, kept up to date as the server saves"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pillow",
    "scipy>=1.18.1",
    "unitypy>=1.25.4",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

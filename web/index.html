<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valheim World Viewer</title>
<style>
  :root {
    --ink: #efe6d2;
    --muted: #b3a88f;
    --accent: #e0a64a;
    --panel: rgba(20, 18, 15, 0.82);
    --line: rgba(239, 230, 210, 0.15);
    --globe: 230px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1915; color: var(--ink);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }

  /* ---- globe place picker ---- */
  #backdrop { position: fixed; inset: 0; background: rgba(10, 9, 8, 0.6); opacity: 0; pointer-events: none; transition: opacity .25s; }
  body.big #backdrop { opacity: 1; pointer-events: auto; }
  #globe { position: fixed; left: 16px; top: 16px; width: var(--globe); z-index: 5;
    transition: left .3s ease, top .3s ease, width .3s ease; }
  body.big #globe { --globe: min(86vmin, 820px); left: calc(50vw - var(--globe) / 2); top: calc(50vh - var(--globe) / 2 - 14px); }
  .disc { position: relative; width: var(--globe); height: var(--globe); border-radius: 50%; overflow: hidden; cursor: zoom-in;
    background: #0d0c0b; box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 2px rgba(224,166,74,.55), 0 0 0 6px rgba(20,18,15,.8);
    transition: width .3s ease, height .3s ease; }
  body.big .disc { cursor: zoom-out; touch-action: none; }
  #layer { position: absolute; }
  #layer img, #layer canvas.fog { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  .mk.future i { background: #6b6458; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
  .mk.future { opacity: .55; }
  #timeline { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 6px 14px 6px 6px; z-index: 4;
    width: min(520px, calc(100vw - 32px)); }
  #timeline button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #2a2620;
    color: var(--ink); cursor: pointer; font-size: 12px; flex: none; }
  #timeline button:hover { border-color: var(--accent); }
  #timeline input { flex: 1; accent-color: var(--accent); min-width: 0; }
  #daylabel { font-size: 12px; color: var(--ink); white-space: nowrap; min-width: 9.5em; text-align: right; }
  body.big #timeline { display: none !important; }
  #night { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; z-index: 4;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 18px; cursor: pointer; }
  #night:hover, #weather:hover { border-color: var(--accent); }
  #weather { position: fixed; top: 16px; right: 64px; width: 40px; height: 40px; border-radius: 50%; z-index: 4;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 18px; cursor: pointer; }
  #weather.off { color: var(--muted); text-decoration: line-through; }
  .shade { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.22), rgba(255,255,255,0) 42%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
  .mk { position: absolute; transform: translate(-50%, -50%); cursor: pointer; z-index: 2; }
  .mk i { display: block; width: 11px; height: 11px; border-radius: 50%; background: var(--accent);
    border: 2px solid #1b1915; box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  .mk.on i { background: #fff; box-shadow: 0 0 0 3px var(--accent), 0 0 12px var(--accent); }
  .mk span { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(20,18,15,.85); border: 1px solid var(--line);
    display: none; pointer-events: none; }
  .mk:hover span, body.big .mk span { display: block; }
  body.big .mk.hide span { display: none; }
  body.big .mk.hide:hover span { display: block; }
  .mk:hover { z-index: 3; }
  body.big .mk span { font-size: 13px; }
  #placename { margin-top: 10px; text-align: center; font-weight: 600; letter-spacing: .02em; text-shadow: 0 1px 3px #000; }
  #placename small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  body.big #placename { display: none; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: var(--muted); font-size: 12px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 5; }
  body.big #hint { opacity: 1; }

  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 11px; padding: 2px 6px;
    background: rgba(20, 18, 15, 0.75); border: 1px solid rgba(224, 166, 74, 0.5); border-radius: 4px; color: var(--ink); }
  .lbl.portal { border-color: rgba(140, 200, 255, 0.7); }
  .lbl.link { pointer-events: auto; cursor: pointer; }
  .lbl.link::after { content: ' \2192'; color: rgba(140, 200, 255, 0.9); }
  .lbl.link:hover, .lbl.hot { background: rgba(40, 80, 120, 0.9); border-color: #8cc8ff; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 20;
    background: radial-gradient(circle, rgba(200, 235, 255, 0.95), rgba(60, 140, 220, 0.85) 60%, rgba(10, 30, 60, 0.95));
    transition: opacity .28s ease; }
  #flash.on { opacity: 1; }
  #loading { position: fixed; bottom: 64px; right: 16px; background: var(--panel);
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  /* ---- points of interest on the globe: boss altars, traders, ships ---- */
  .poi { position: absolute; transform: translate(-50%, -50%); z-index: 1; cursor: default; }
  .poi i { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-style: normal; font-size: 10px;
    background: rgba(20,18,15,.85); border: 1px solid rgba(239,230,210,.5); overflow: hidden; }
  .poi img { width: 100%; height: 100%; object-fit: cover; }
  .poi.alive img { filter: grayscale(1) brightness(.6); }
  .poi.beaten i { border-color: var(--accent); }
  .poi.vehicle i { background: rgba(30,60,90,.85); border-color: rgba(140,200,255,.6); }
  .poi span { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); white-space: nowrap; font-size: 11px;
    padding: 1px 6px; border-radius: 4px; background: rgba(20,18,15,.85); border: 1px solid var(--line); display: none; pointer-events: none; }
  .poi:hover span { display: block; }
  .poi:hover { z-index: 4; }
  body.big .poi i { width: 28px; height: 28px; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
  body.big #hud, body.big #panel { display: none; }
  body.big .poi span { bottom: 30px; font-size: 13px; display: block; }
  body.big .poi.hide span { display: none; }
  body.big .poi.hide:hover span, body.big .poi.pin span { display: block; }
  body.big .poi { cursor: pointer; }
  .poi.pin { z-index: 4; }
  .poi.bed i { background: rgba(60,40,25,.85); }
  .poi.grave i { background: rgba(70,25,25,.9); border-color: rgba(255,140,120,.7); color: #ffd2c8; }
  body.big .poi.bed i { width: 22px; height: 22px; font-size: 12px; }
  body.big .poi.bed span { bottom: 24px; }
  .poi.future { display: none; }

  /* ---- status bar: game day, bosses, who's online ---- */
  #hud { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 4px 14px; height: 40px; cursor: pointer;
    white-space: nowrap; font-size: 13px; }
  #hud:hover { border-color: var(--accent); }
  #hud .day { font-weight: 600; letter-spacing: .02em; }
  #hud .trophies { display: flex; gap: 3px; }
  #hud .trophies img { width: 24px; height: 24px; border-radius: 50%; background: #2a2620; }
  #hud .trophies img.alive { filter: grayscale(1) brightness(.45); }
  #hud .who { color: var(--muted); }
  #hud .who b { color: #7fd97f; font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5a554b; margin-right: 5px; vertical-align: 1px; }
  .dot.on { background: #5fd35f; box-shadow: 0 0 6px #5fd35f; }
  #panel { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 6; width: min(560px, calc(100vw - 32px));
    max-height: calc(100vh - 150px); overflow: auto; background: rgba(20,18,15,.94); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #panel.on { display: block; }
  #panel h3 { margin: 4px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  #panel .bosses { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  #panel .boss { text-align: center; font-size: 11px; color: var(--muted); }
  #panel .boss img { width: 44px; height: 44px; border-radius: 50%; background: #2a2620; display: block; margin: 0 auto 3px; }
  #panel .boss.alive img { filter: grayscale(1) brightness(.45); }
  #panel .boss b { display: block; color: var(--ink); font-weight: 600; }
  #panel table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  #panel th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  #panel td { padding: 5px 6px; border-bottom: 1px solid rgba(239,230,210,.06); }
  #panel td.n, #panel th.n { text-align: right; font-variant-numeric: tabular-nums; }
  #panel .bars { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin: 4px 0 2px; }
  #panel .bars div { flex: 1; background: var(--accent); opacity: .75; border-radius: 2px 2px 0 0; min-height: 1px; }
  #panel .bars div:hover { opacity: 1; }
  #panel .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  #panel .note { font-size: 11px; color: var(--muted); margin-top: 8px; }
  @media (max-width: 900px) { #hud .trophies { display: none; } }
  @media (max-width: 640px) { #hud { top: auto; bottom: 66px; } #panel { top: auto; bottom: 116px; max-height: calc(100vh - 200px); } }
  @media (max-width: 640px) { :root { --globe: 150px; } #globe { left: 10px; top: 10px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.min.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>
<div id="backdrop"></div>
<div id="globe">
  <div class="disc" id="disc">
    <div id="layer"><img src="assets/worldmap.png" alt="World map"><div id="markers"></div></div>
    <div class="shade"></div>
  </div>
  <div id="placename"></div>
</div>
<div id="timeline" style="display:none"><button id="play" title="Play the history">&#9654;</button><input id="day" type="range" min="0" max="0" step="1"><span id="daylabel"></span></div>
<div id="hud" title="Bosses and Vikings" style="display:none"></div>
<div id="panel"></div>
<button id="night" title="Night">&#9790;</button>
<button id="weather" title="Weather">&#9729;&#xFE0E;</button>
<div id="hint">Pick a place · pinch or double-tap to zoom</div>
<div id="flash"></div>
<div id="loading">Loading…</div>
<script type="module" src="app.js"></script>
</body>
</html>
